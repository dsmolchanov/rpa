name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]

# IMPORTANT: this file is a starting-point template. The job keys below must
# match the required-status-check names in branch protection:
#   lint, unit, integration, e2e, coverage
# Tune the per-repo commands (npm, pnpm, pytest, go test, cargo test, etc.)
# without renaming the jobs.
#
# This repository has no package.json / pyproject.toml at the root, so the
# template steps are no-ops here. The repo-owned Python checks (hook runner
# tests, skill-local tests, and the docs validator) therefore run as explicit
# steps INSIDE `unit`, and the research eval preflight runs INSIDE
# `integration` — those job names are the required contexts (asserted by the
# dev-agent bootstrap), so new job names would not gate merges.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: |
          if [ -f package.json ]; then
            npm ci && npm run lint --if-present
          elif [ -f pyproject.toml ]; then
            pip install ruff && ruff check .
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          if [ -f package.json ]; then
            npm ci && npm test --if-present
          elif [ -f pyproject.toml ]; then
            pip install -e . && pytest tests/unit -q || pytest -q -m "not integration and not e2e"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs validator dependencies (same pins as docs-validate)
        run: python3 -m pip install --quiet pyyaml==6.0.2 markdown-it-py==3.0.0
      - name: Hook gate runner tests
        run: python3 plugins/rpa/hooks/test_run_gate.py
      - name: TDD evidence kernel tests (EV-01…EV-38)
        run: python3 plugins/rpa/skills/tdd/scripts/test_evidence.py
      - name: TDD session-log validator tests (VL-01…VL-44)
        run: python3 plugins/rpa/skills/tdd/scripts/test_validate_session_log.py
      - name: Docs validator self-test
        run: python3 scripts/validate_docs.py --self-test
      - name: Validate repository docs
        run: python3 scripts/validate_docs.py --root .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        run: |
          if [ -f package.json ]; then
            npm ci && npm run test:integration --if-present
          elif [ -f pyproject.toml ]; then
            pip install -e . && pytest -q -m integration || true
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research eval preflight (offline proof of every capability)
        working-directory: plugins/rpa/skills/research-codebase/evals/public
        timeout-minutes: 15
        run: python3 runner.py --preflight

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e tests
        run: |
          if [ -f package.json ]; then
            npm ci && npm run test:e2e --if-present
          elif [ -f pyproject.toml ]; then
            pip install -e . && pytest -q -m e2e || true
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run coverage
        run: |
          if [ -f package.json ]; then
            npm ci && npm test --if-present -- --coverage
          elif [ -f pyproject.toml ]; then
            pip install -e . pytest-cov && pytest --cov=. --cov-report=term
          fi

  # Deterministic docs gate (conventions.md §4): fails on zero target files,
  # self-tests against positive/negative fixtures before validating.
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validator dependencies (registered in pilot plan, prereq 1)
        run: python3 -m pip install --quiet pyyaml==6.0.2 markdown-it-py==3.0.0
      - name: Self-test validator against fixtures
        run: python3 scripts/validate_docs.py --self-test
      - name: Validate repository docs
        run: python3 scripts/validate_docs.py --root .
