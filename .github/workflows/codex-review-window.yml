name: codex-review-window
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A review submitted after a gate run finished starts a fresh run for the
  # same head SHA; branch protection uses the latest run, so the gate
  # self-heals when Codex is slower than the polling window.
  pull_request_review:
    types: [submitted]

# The job key below MUST match the required-status-check name in branch
# protection. GitHub matches required checks against the job key (or the
# reported check-run name), NOT a custom display name. Do not add `name:`
# at the job level unless you also update branch protection.
#
# 2026-07-02: upgraded from a blind sleep to a real gate. The old soak lost
# the race — e.g. BoardAI#146 merged at 08:43:38 and Codex posted a P1 19s
# later. Now the check waits for the Codex review of the CURRENT head commit
# and FAILS while it reports P1/[BLOCKER] findings, so auto-merge holds and
# Auto-fix pushes re-run the loop until Codex is green.
#
# 2026-08-30: the unconditional advisory pass at the deadline lost the race
# again — rpa#21 passed after 8m09s with no review, auto-merge fired at
# 09:25:59Z, and Codex posted three P1s at 09:27:02Z (63s late). The
# deadline now fails closed when the repository is demonstrably connected
# to Codex (bot reviews exist on this PR or recent PRs); the advisory pass
# survives only for repos with no evidence of a Codex connection. Every
# submitted review re-runs the FULL gate (no author skip): a step skipped
# on a review event would report a green job and launder a red verdict.
jobs:
  codex-review-window:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODEX_BOT: chatgpt-codex-connector[bot]
    steps:
      - name: Fast-merge opt-out
        if: ${{ contains(github.event.repository.topics, 'fast-merge') }}
        run: echo "Repo has topic 'fast-merge'; Codex gate skipped."

      - name: Gate on Codex verdict for this commit
        if: ${{ !contains(github.event.repository.topics, 'fast-merge') }}
        run: |
          set -euo pipefail
          echo "Waiting for Codex review of ${HEAD_SHA} on PR #${PR}"

          review_id_for_head() {
            gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .commit_id == \"${HEAD_SHA}\")] | (last | .id) // empty"
          }

          # Codex auto-reviews on open/ready but NOT on pushes — ask for a
          # re-review when a fix commit lands. If Codex ignores bot-authored
          # mentions this is a no-op and we fall through to the timeout path.
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -z "$(review_id_for_head)" ]; then
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="@codex review" >/dev/null || true
            echo "Posted '@codex review' to request a re-review of the new commit."
          fi

          DEADLINE=$((SECONDS + 780))
          RID=""
          while [ ${SECONDS} -lt ${DEADLINE} ]; do
            RID="$(review_id_for_head)"
            [ -n "${RID}" ] && break
            sleep 20
          done

          if [ -z "${RID}" ]; then
            # No review for this head at the deadline. Pass advisorily only
            # when nothing evidences a Codex connection; otherwise fail
            # closed — the pull_request_review trigger re-runs this gate
            # the moment the review lands.
            # NB: --paginate emits one JSON array per page, so `length`
            # would print one number per page; count matching ids per line
            # instead.
            CONNECTED=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
              --jq ".[] | select(.user.login == \"${CODEX_BOT}\") | .id" \
              | wc -l | tr -d ' ')
            if [ "${CONNECTED}" -eq 0 ]; then
              for n in $(gh api "repos/${REPO}/pulls?state=all&per_page=10" --jq '.[].number'); do
                HITS=$(gh api "repos/${REPO}/pulls/${n}/reviews" \
                  --jq ".[] | select(.user.login == \"${CODEX_BOT}\") | .id" \
                  | wc -l | tr -d ' ' || echo 0)
                if [ "${HITS}" -gt 0 ]; then CONNECTED=1; break; fi
              done
            fi
            if [ "${CONNECTED}" -gt 0 ]; then
              echo "::error::No Codex review for ${HEAD_SHA} at the deadline, but this repository is connected to Codex (bot reviews exist). Failing closed; a submitted Codex review re-runs this gate automatically."
              exit 1
            fi
            echo "::warning::No Codex review for ${HEAD_SHA} within the window — passing (advisory fallback; repo may not be connected to Codex Cloud)."
            exit 0
          fi

          # Give inline finding comments a moment to finish landing.
          sleep 15

          PATTERN='\[BLOCKER\]|badge/P1|P1 Badge'
          INLINE=$(gh api "repos/${REPO}/pulls/${PR}/comments" --paginate \
            --jq ".[] | select(.pull_request_review_id == ${RID}) | .body" \
            | grep -cE "${PATTERN}" || true)
          BODY=$(gh api "repos/${REPO}/pulls/${PR}/reviews/${RID}" --jq '.body' \
            | grep -cE "${PATTERN}" || true)

          if [ "$((INLINE + BODY))" -gt 0 ]; then
            echo "::error::Codex review reports P1/[BLOCKER] finding(s) on ${HEAD_SHA} (inline hits: ${INLINE}). Auto-fix must push a fix commit; this check re-runs on the new head until Codex is green."
            exit 1
          fi
          echo "Codex review is green for ${HEAD_SHA}."
